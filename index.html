<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Repulgue</title>
    <link rel="icon" href="assets/empanada.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar sticky-top barra-principal">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="assets/empanada.png" alt="Logo de La Repulgue" width="36" height="36">
                La Repulgue
            </a>
            <a href="#seccion-pedido" class="btn btn-carrito">
                <i class="bi bi-cart3"></i> Mi pedido <span id="contador-pedido" class="badge rounded-pill">0</span>
            </a>
        </div>
    </nav>

    <header>
        <h1>La Repulgue</h1>
        <p>Empanadas caseras, recién salidas del horno</p>
    </header>

    <main class="container">
        <section id="seccion-empanadas">
            <h2 class="my-4">Nuestras Empanadas</h2>
            <div id="filtros" class="d-flex flex-wrap gap-2 mb-4">
                <button class="btn boton-filtro active" data-categoria="todos">Todos</button>
                <button class="btn boton-filtro" data-categoria="carne">Carne</button>
                <button class="btn boton-filtro" data-categoria="pollo">Pollo</button>
                <button class="btn boton-filtro" data-categoria="verdura">Verdura</button>
                <button class="btn boton-filtro" data-categoria="jyq">JyQ</button>
            </div>
            <p id="estado-carga" class="text-muted">Cargando empanadas...</p>
            <div id="contenedor-empanadas" class="row g-4"></div>
        </section>

        <section id="seccion-pedido" class="my-5">
            <h2>Tu Pedido</h2>
            <div id="lista-pedido"></div>

            <form id="form-entrega" class="mt-4">
                <h3 class="h5">¿Cómo querés recibirlo?</h3>

                <div class="mb-3">
                    <label for="nombre-cliente" class="form-label">Tu nombre</label>
                    <input type="text" id="nombre-cliente" class="form-control" placeholder="Ej: Lucía">
                </div>

                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo-entrega" id="entrega-envio" value="envio" checked>
                        <label class="form-check-label" for="entrega-envio">Envío a domicilio</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo-entrega" id="entrega-retiro" value="retiro">
                        <label class="form-check-label" for="entrega-retiro">Retiro en el local</label>
                    </div>
                </div>

                <div id="campo-direccion" class="mb-3">
                    <label for="direccion-cliente" class="form-label">Dirección</label>
                    <input type="text" id="direccion-cliente" class="form-control" placeholder="Calle, número y esquina">
                </div>

                <div id="campo-sucursal" class="mb-3 d-none">
                    <label for="sucursal-elegida" class="form-label">Sucursal</label>
                    <select id="sucursal-elegida" class="form-select"></select>
                </div>
            </form>

            <div id="resumen-pedido">
                <p>Subtotal: $<span id="subtotal-pedido">0</span></p>
                <p>Envío: $<span id="envio-pedido">0</span></p>
                <p class="total">Total: $<span id="total-pedido">0</span></p>
            </div>

            <div class="d-flex flex-wrap justify-content-end gap-2">
                <button id="btn-vaciar" class="btn boton-vaciar"><i class="bi bi-trash3"></i> Vaciar pedido</button>
                <button id="btn-confirmar" class="btn boton-confirmar"><i class="bi bi-check2-circle"></i> Confirmar pedido</button>
            </div>
        </section>
    </main>

    <footer class="text-center py-4">
        <p>© 2026 La Repulgue - Las empanadas que encantan</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/pedido.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
